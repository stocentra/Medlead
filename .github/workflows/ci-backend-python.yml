# .github/workflows/ci-backend-python.yml

name: CI/CD for Python Backend (AI Core)

on:
  push:
    branches:
      - main # This workflow runs on pushes to the main branch
    paths:
      - 'apps/api-python/**' # Only run if changes are detected in the Python app directory
      - '.github/workflows/ci-backend-python.yml' # Also run if the workflow file itself changes

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required to push images to GitHub Container Registry

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=moby/buildkit:v0.12.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api-python # The directory where the Dockerfile is located
          file: ./apps/api-python/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/medlead-api-python:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo ${{ steps.build-and-push.outputs.digest }}

