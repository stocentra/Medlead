<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body {
            background-color: #0F172A; /* Dark Blue/Navy */
            color: #F8FAFC; /* Light Gray */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 500px;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.125rem;
            color: #94A3B8; /* Medium Gray */
            margin-bottom: 2rem;
        }
        .button {
            background-color: #FF6B35; /* Orange/Coral */
            color: #FFFFFF;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease-in-out;
        }
        .button:hover {
            background-color: #F97316; /* A slightly darker orange */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Are you lost, doc?</h1>
        <p>
            It seems you've wandered into the restricted area of the hospital. These are the API endpoints for the MedLead platform. There's nothing to see here for a human.
        </p>
        <a href="https://medlead.ir" class="button">Back to the Clinic</a>
    </div>
</body>
</html>
